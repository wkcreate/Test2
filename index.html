<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Для моєї коханої дружини ❤️ Гра-сортування кольорів">
<meta name="theme-color" content="#2b0f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Для коханої">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Для коханої ❤️ Сортування</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b0f2f;--bg2:#5a1c43;--gold:#f2c9a5;--rose:#ff6f91;--ink:#fff4ee;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);background-color:var(--bg1);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:inherit}
#splash{justify-content:center;gap:14px;text-align:center;z-index:5;transition:opacity .6s;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1) 70%);background-color:var(--bg1)}
#splash.hide{opacity:0;pointer-events:none}
.frame{width:168px;height:168px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 8px rgba(242,201,165,.15),0 0 50px rgba(255,111,145,.45);background:var(--glass) center/cover;display:grid;place-items:center;font-size:13px;padding:22px;cursor:pointer;color:var(--gold);position:relative}
.frame b{position:absolute;right:-2px;bottom:6px;font-size:30px}
.love{font-family:'Marck Script',cursive;font-size:36px;line-height:1.1;margin:8px 20px 0;color:var(--gold)}
.from{font-family:'Marck Script',cursive;font-size:24px}
.bar{width:210px;height:8px;border-radius:8px;background:var(--glass);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));animation:load 2.8s ease forwards}
@keyframes load{to{width:100%}}
#menu{display:none;flex-direction:column;gap:10px;align-items:center}
.cta{background:linear-gradient(135deg,var(--rose),#ff9a6b);padding:13px 34px;border-radius:30px;font-weight:800;font-size:18px;box-shadow:0 8px 24px rgba(255,111,145,.4)}
.cta.hard{background:linear-gradient(135deg,#ff5a3d,#c2185b);font-size:16px;padding:10px 28px}
#game{padding:inherit}
.top{width:100%;max-width:460px;padding:12px 12px 4px;display:flex;align-items:center;gap:8px}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-weight:800;white-space:nowrap}
.xp{flex:1;min-width:0}
.xp small{display:block;font-size:11px;opacity:.85;margin-bottom:3px;white-space:nowrap;overflow:hidden}
.xp .bar{width:100%;height:7px;margin:0}
.xp .bar i{animation:none;transition:width .5s}
h1{margin:6px 0 0;font-family:'Marck Script',cursive;font-weight:400;font-size:30px;color:var(--gold)}
#board{flex:1;width:100%;max-width:460px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:22px 12px;padding:14px 12px}
.tube{width:46px;height:138px;border:2px solid var(--line);border-top-color:transparent;border-radius:0 0 24px 24px;background:var(--glass);display:flex;flex-direction:column-reverse;padding:2px;gap:2px;overflow:hidden;transition:transform .28s,box-shadow .2s;cursor:pointer}
.tube.sel{transform:translateY(-14px);box-shadow:0 0 18px var(--gold)}
.tube.hint{box-shadow:0 0 22px 4px var(--rose);animation:pulse .5s 3 alternate}
@keyframes pulse{to{transform:translateY(-8px)}}
.seg{height:31px;border-radius:7px;background:linear-gradient(90deg,rgba(255,255,255,.4),transparent 45%),var(--c);flex:none}
.stream{position:fixed;width:6px;height:70px;border-radius:3px;background:var(--c);z-index:8;transform-origin:top;animation:flow .38s ease-out forwards;pointer-events:none}
@keyframes flow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tools{width:100%;max-width:460px;display:flex;gap:8px;padding:6px 12px 14px;justify-content:center}
.tool{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:9px 2px;font-size:12px;font-weight:800;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool span{font-size:20px}
.tool em{position:absolute;top:-7px;right:6px;background:var(--rose);border-radius:10px;font-style:normal;font-size:11px;padding:1px 6px}
.tool:active,.cta:active{transform:scale(.96)}
.modal{position:absolute;inset:0;z-index:6;background:rgba(20,5,24,.78);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.card{width:100%;max-width:380px;max-height:88vh;overflow:auto;background:linear-gradient(160deg,#4a1a45,#2b0f2f);border:1px solid var(--line);border-radius:26px;padding:22px;text-align:center}
.card h2{font-family:'Marck Script',cursive;font-weight:400;font-size:34px;margin:0 0 10px;color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;background:var(--glass);border-radius:16px;padding:10px 12px;margin:8px 0;text-align:left}
.row>span{font-size:28px}.row div{flex:1;font-size:13px}.row b{display:block;font-size:15px}
.sec{text-align:left;margin:14px 2px 0;font-weight:800;color:var(--gold)}
.buy{background:var(--gold);color:#3a1236;border-radius:14px;padding:8px 12px;font-weight:800}
.buy:disabled{opacity:.4}
.reward{font-size:20px;font-weight:800;margin:6px 0 10px}
.stars{font-size:38px;color:var(--gold);letter-spacing:6px}
.msg{font-family:'Marck Script',cursive;font-size:25px;line-height:1.15;color:var(--gold);margin:12px 0 10px}
.small{font-size:13px;opacity:.8;margin:6px 0 12px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#000a;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.heart{position:absolute;bottom:-30px;font-size:24px;animation:up 3s linear forwards;z-index:9;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash" class="screen">
  <label class="frame" id="frame"><span id="ph">Тут буде ваше спільне фото</span><b>❤️</b>
    <input type="file" accept="image/*" id="file" hidden></label>
  <div class="love">Для моєї коханої дружини</div>
  <div class="from">Від люблячого чоловіка ❤️</div>
  <div class="bar" id="loadbar"><i></i></div>
  <div id="menu"><button class="cta" id="play"></button><button class="cta hard" id="playH"></button></div>
</div>

<div id="game" class="screen">
  <div class="top">
    <button class="pill" id="home">🏠</button>
    <div class="pill">🪙 <span id="coins"></span></div>
    <div class="xp"><small id="rank"></small><div class="bar"><i id="xpbar"></i></div></div>
    <button class="pill" id="snd"></button>
    <button class="pill" id="shopBtn">🛍️</button>
  </div>
  <h1 id="title"></h1>
  <div id="board"></div>
  <div class="tools">
    <button class="tool" data-t="undo"><span>↩️</span>Отмена<em></em></button>
    <button class="tool" data-t="hint"><span>💡</span>Подсказка<em></em></button>
    <button class="tool" data-t="tube"><span>🧪</span>Пробирка<em></em></button>
    <button class="tool" data-t="restart"><span>🔄</span>Заново</button>
  </div>
</div>

<div class="modal" id="shop"><div class="card">
  <h2>Магазин</h2><div id="items"></div>
  <p class="small">За уровень: +10 🪙 и +5 ✨ (в харде ×2) · v1.0.0</p>
  <button class="buy" id="closeShop">Закрыть</button>
</div></div>

<div class="modal" id="pop"><div class="card">
  <h2 id="popT"></h2><div id="popB"></div>
  <button class="cta" id="popBtn" style="margin:auto"></button>
</div></div>
<div class="toast" id="toast"></div>

function solved(t){return t.every(x=>x.length===0||(x.length===CAP&&x.every(v=>v===x[0])))}
function solvable(t0,lim){
  const seen=new Set();let n=0;
  const key=t=>t.map(x=>x.join(",")).sort().join("|");
  function dfs(t){
    if(solved(t))return true;
    const k=key(t);if(seen.has(k)||++n>lim)return false;seen.add(k);
    const mv=[];
    for(let a=0;a<t.length;a++){const A=t[a];if(!A.length)continue;
      const v=A[A.length-1],uni=A.every(z=>z===v);
      if(uni&&A.length===CAP)continue;
      for(let b=0;b<t.length;b++){const B=t[b];
        if(a===b||B.length>=CAP)continue;
        if(B.length?B[B.length-1]!==v:uni)continue;
        mv.push([B.length?0:1,a,b])}}
    mv.sort((p,q)=>p[0]-q[0]);
    for(const[,a,b]of mv){const u=t.map(x=>x.slice()),A=u[a],B=u[b],v=A[A.length-1];
      while(A.length&&A[A.length-1]===v&&B.length<CAP)B.push(A.pop());
      if(dfs(u))return true}
    return false}
  return dfs(t0)}
function gen(n,E,hd){
  const c=Math.min(12,colorsFor(n)+(hd?1:0)),M=Math.floor(Math.min(c*30,60+c*8+n*0.5));
  let t;
  for(let att=0;att<(E>1?30:20);att++){
    const r=rng(n*7919+13+att*101+(hd?5:0));
    t=[];for(let i=0;i<c;i++)t.push(Array(CAP).fill(i));for(let i=0;i<E;i++)t.push([]);
    for(let k=0;k<M;k++){
      const f=t.map((x,i)=>x.length?i:-1).filter(i=>i>=0),a=f[Math.floor(r()*f.length)];
      const g=t.map((x,i)=>x.length<CAP&&i!==a&&x[x.length-1]!==t[a][t[a].length-1]?i:-1).filter(i=>i>=0);
      if(!g.length)continue;t[g[Math.floor(r()*g.length)]].push(t[a].pop());
    }
    if(!solved(t)&&solvable(t,E>1?40000:15000))return t;
  }
  return E>1?t:null;
}

// ---------- игра ----------
let hard=false,tubes=[],hist=[],sel=null,locked=false,mv=0,els=[];
const lv=()=>hard?S.hl:S.level,mk=()=>hard?"h":"n",clone=()=>tubes.map(x=>x.slice());
function keep(){if(locked||!tubes.length)return;S.cs[mk()]={v:VER,l:lv(),t:tubes,hs:hist.slice(-30),mv};save()}
function start(fresh){
  const c=S.cs[mk()];
  if(!fresh&&c&&c.v===VER&&c.l===lv()&&Array.isArray(c.t)){tubes=c.t;hist=c.hs||[];mv=c.mv||0}
  else{tubes=(hard&&gen(lv(),1,true))||gen(lv(),2,hard);hist=[];mv=0}
  sel=null;locked=false;draw();keep();
}
function draw(hl=[]){
  $("#coins").textContent=S.coins;$("#snd").textContent=S.snd?"🔊":"🔇";
  $("#rank").textContent=`Ранг ${Math.floor(S.xp/50)+1} · ✨ ${S.xp%50}/50 · ⭐ ${S.stars}`;
  $("#xpbar").style.width=(S.xp%50)*2+"%";
  $("#title").textContent=(hard?"Хард ":"Уровень ")+lv()+(hard?" 🔥":"");
  const b=$("#board");b.innerHTML="";els=[];
  tubes.forEach((t,i)=>{
    const d=document.createElement("div");d.className="tube"+(i===sel?" sel":"")+(hl.includes(i)?" hint":"");
    t.forEach(v=>{const s=document.createElement("div");s.className="seg";s.style.setProperty("--c",COLORS[v]);d.appendChild(s)});
    d.onclick=()=>tap(i);b.appendChild(d);els.push(d);
  });
  document.querySelectorAll(".tool").forEach(e=>{const k=e.dataset.t,m=e.querySelector("em");
    e.style.display=hard&&k!=="restart"?"none":"";if(m){m.textContent=S.inv[k]||0;m.style.display=S.inv[k]?"":"none"}});
}
const canPour=(a,b)=>a!==b&&tubes[a].length&&tubes[b].length<CAP&&(!tubes[b].length||tubes[b][tubes[b].length-1]===tubes[a][tubes[a].length-1]);
const moves=()=>{for(let a=0;a<tubes.length;a++)for(let b=0;b<tubes.length;b++)if(canPour(a,b)&&!(tubes[b].length===0&&tubes[a].every(v=>v===tubes[a][0])))return true;return false};
function tap(i){
  if(locked)return;
  if(sel===null){if(tubes[i].length){sel=i;tone(660,.06);draw()}return}
  if(sel===i){sel=null;draw();return}
  if(canPour(sel,i))pour(sel,i);else{sel=tubes[i].length?i:null;draw()}
}
function pour(a,b){
  const A=tubes[a],B=tubes[b],v=A[A.length-1];
  hist.push(clone());mv++;sel=null;locked=true;
  const apply=()=>{while(A.length&&A[A.length-1]===v&&B.length<CAP)B.push(A.pop());
    locked=false;draw();keep();vib();
    if(solved(tubes))win();else if(!moves())toast("Ходов нет — отмените ход или добавьте пробирку")};
  if(reduce)apply();else anim(a,b,v,apply);
}
function anim(a,b,v,done){
  const ea=els[a],ra=ea.getBoundingClientRect(),rb=els[b].getBoundingClientRect(),L=ra.left<rb.left;
  ea.style.zIndex=9;ea.style.transform=`translate(${rb.left-ra.left+(L?-56:56)}px,${rb.top-ra.top-46}px) rotate(${L?60:-60}deg)`;
  tone(520,.1);
  setTimeout(()=>{const s=document.createElement("div");s.className="stream";
    s.style.cssText=`left:${rb.left+rb.width/2-3}px;top:${rb.top-4}px;--c:${COLORS[v]}`;document.body.appendChild(s);
    tone(400,.12);tone(330,.14,.1);setTimeout(()=>{s.remove();done()},380)},260);
}
function hearts(){for(let i=0;i<22;i++){const h=document.createElement("div");h.className="heart";h.textContent=["❤️","💖","💕"][i%3];h.style.left=Math.random()*95+"%";h.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),4000)}}
function card(t,body,btn,cb){
  $("#popT").textContent=t;$("#popB").innerHTML=body;$("#popBtn").textContent=btn;
  $("#popBtn").onclick=()=>{$("#pop").classList.remove("on");cb&&cb()};$("#pop").classList.add("on");
}
function win(){
  locked=true;const L=lv(),c=tubes.filter(x=>x.length).length,par=c*3,st=mv<=par?3:mv<=par*1.6?2:1,R=hard?2:1;
  S.coins+=10*R;S.xp+=5*R;S.stars+=st;S.cs[mk()]=null;
  if(hard)S.hl=Math.min(1000,S.hl+1);else S.level=Math.min(1000,S.level+1);
  save();hearts();vib([30,40,30]);[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.12,"triangle"));
  let b=`<div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="reward">+${10*R} 🪙 &nbsp; +${5*R} ✨</div><div class="small">Ходов: ${mv} · Всего звёзд: ${S.stars}</div>`;
  if(!hard&&L%10===0)b+=`<div class="msg">${MSG[(L/10-1)%MSG.length]}</div>`;
  setTimeout(()=>card(hard?"Хард пройден! 🔥":"Уровень пройден! ❤️",b,"Дальше",()=>start(true)),500);
}
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2200)};

document.querySelectorAll(".tool").forEach(btn=>btn.onclick=()=>{
  if(locked)return;const k=btn.dataset.t;
  if(k==="restart"){start(true);return}
  if(hard){toast("В харде подсказки отключены");return}
  if(!S.inv[k]){toast("Закончилось — загляните в магазин 🛍️");return}
  if(k==="undo"){if(!hist.length){toast("Пока нечего отменять");return}tubes=hist.pop();mv=Math.max(0,mv-1);sel=null}
  if(k==="tube"){hist.push(clone());tubes.push([])}
  if(k==="hint"){
    let best=null,bs=-1;
    for(let a=0;a<tubes.length;a++)for(let b=0;b<tubes.length;b++)if(canPour(a,b)){
      const uni=tubes[a].every(v=>v===tubes[a][0]);
      if(uni&&!tubes[b].length)continue;
      const s=(tubes[b].length?10:0)+(uni?0:5);if(s>bs){bs=s;best=[a,b]}}
    if(!best){toast("Подсказок нет — попробуйте отмену хода");return}
    S.inv[k]--;save();draw(best);return;
  }
  S.inv[k]--;draw();keep();
});

// ---------- магазин ----------
function shop(){
  const w=$("#items");w.innerHTML="";
  const row=(i,n,d,btn)=>{const r=document.createElement("div");r.className="row";r.innerHTML=`<span>${i}</span><div><b>${n}</b>${d}</div>`;r.appendChild(btn);w.appendChild(r)};
  const bt=(txt,dis,fn)=>{const b=document.createElement("button");b.className="buy";b.textContent=txt;b.disabled=dis;b.onclick=fn;return b};
  for(const k in ITEMS){const it=ITEMS[k];row(it.i,it.n,`${it.d}<br>Есть: ${S.inv[k]||0}`,bt("🪙 "+it.p,S.coins<it.p,()=>{S.coins-=it.p;S.inv[k]=(S.inv[k]||0)+1;save();shop();draw()}))}
  const h=document.createElement("div");h.className="sec";h.textContent="Темы оформления";w.appendChild(h);
  for(const k in T){const t=T[k],own=S.own.includes(k),cur=S.th===k;
    row("🎨",t.n,cur?"Выбрана":own?"Куплена":"Новый вид игры",bt(own?(cur?"✓":"Выбрать"):"🪙 "+t.p,own?cur:S.coins<t.p,()=>{if(!own){S.coins-=t.p;S.own.push(k)}S.th=k;save();theme();shop();draw()}))}
}
$("#shopBtn").onclick=()=>{shop();$("#shop").classList.add("on")};
$("#closeShop").onclick=()=>$("#shop").classList.remove("on");
$("#snd").onclick=()=>{S.snd=S.snd?0:1;save();draw();tone(660,.08)};

// ---------- меню, подарок дня ----------
function menu(){keep();$("#loadbar").style.display="none";$("#play").textContent="Играть · уровень "+S.level;$("#playH").textContent="🔥 Хард · уровень "+S.hl;$("#menu").style.display="flex";$("#splash").classList.remove("hide")}
function go(h){hard=h;$("#splash").classList.add("hide");start();daily();tone(523,.1)}
$("#play").onclick=()=>go(false);$("#playH").onclick=()=>go(true);$("#home").onclick=menu;
const fd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function daily(){
  const now=new Date(),day=fd(now),y=fd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
  const sp=()=>{if(SPECIAL.d&&day.slice(5)===SPECIAL.d&&S.sp!==now.getFullYear()){S.sp=now.getFullYear();S.coins+=100;save();draw();hearts();card("💌",`<div class="msg">${SPECIAL.t}</div><div class="reward">+100 🪙</div>`,"❤️")}};
  if(S.day===day){sp();return}
  S.streak=S.day===y?Math.min(S.streak+1,7):1;S.day=day;const g=10+S.streak*5;S.coins+=g;save();draw();
  card("Подарок дня 🎁",`<div class="reward">+${g} 🪙</div><div class="small">Серия дней: ${S.streak} 🔥</div>`,"Забрать",sp);
}
setTimeout(menu,2900);
addEventListener("pagehide",keep);
document.addEventListener("visibilitychange",()=>{if(document.hidden)keep()});
if("serviceWorker" in navigator)addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js")}catch(e){}});
</script>
